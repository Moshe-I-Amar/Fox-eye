services:
  - type: web
    name: fox-eye-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false          # set to your Vercel URL after frontend deploys
      - key: DB_CONNECT_RETRIES
        value: 5
      - key: DB_CONNECT_RETRY_DELAY_MS
        value: 2000
